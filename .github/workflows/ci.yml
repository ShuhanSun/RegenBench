name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run protocol tests
        run: python -m unittest discover -s tests -v
      - name: Run demo
        run: python examples/run_demo.py
